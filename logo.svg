<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#f5c518"/>
      <stop offset="1" stop-color="#c8962a"/>
    </linearGradient>
    <clipPath id="bar">
      <rect x="0" y="0" width="92" height="18" rx="3"/>
    </clipPath>
  </defs>

  <!-- Claquette ouverte -->
  <g transform="translate(14 24) rotate(-14 4 18)">
    <g clip-path="url(#bar)">
      <rect x="0" y="0" width="92" height="18" fill="#111111"/>
      <polygon points="6,0 20,0 10,18 -4,18" fill="url(#gold)"/>
      <polygon points="32,0 46,0 36,18 22,18" fill="url(#gold)"/>
      <polygon points="58,0 72,0 62,18 48,18" fill="url(#gold)"/>
      <polygon points="84,0 98,0 88,18 74,18" fill="url(#gold)"/>
    </g>
    <rect x="0" y="0" width="92" height="18" rx="3" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Corps du clap -->
  <rect x="14" y="46" width="92" height="62" rx="5" fill="#111111" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="20" cy="44" r="4" fill="url(#gold)"/>
  <text x="60" y="97" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" font-weight="700" fill="url(#gold)">R</text>
</svg>
