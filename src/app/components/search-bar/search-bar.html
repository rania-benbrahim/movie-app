<div class="container">
    <p class="tagline">
        {{ movieService.t('Ce soir', 'Tonight') }}
        · {{ movieService.label(movieService.category()) }}
    </p>
    <div class="search-container">
        <label for="title">{{ movieService.t('Titre', 'Title') }}</label>
        <input
            type="text"
            id="title"
            placeholder="e.g : Dexter"
            #movieTitle
            (input)="getMovieByTitle(movieTitle.value)"
        />
        <fa-icon [icon]="faMagnifyingGlass" (click)="getMovieByTitle(movieTitle.value)" />
    </div>
</div>
