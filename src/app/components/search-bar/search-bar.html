<div class="container">
    <div class="search-container">
        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            #movieTitle
            (keyup.enter)="search(movieTitle.value)"
        />
        <fa-icon [icon]="faMagnifyingGlass" (click)="search(movieTitle.value)" />
    </div>
</div>
